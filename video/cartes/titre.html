<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Titre</title>
<style>
:root{--papier:#F4F6F2;--encre:#1B2320;--sapin:#17463A;--meleze:#8A5A2B;--second:#5A625D;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{margin:0;width:1280px;height:720px;background:var(--papier);color:var(--encre);overflow:hidden}
main{box-sizing:border-box;width:1280px;height:720px;padding:0 120px;display:flex;flex-direction:column;justify-content:center;gap:28px;opacity:0;animation:ap 400ms ease-out forwards}
@keyframes ap{to{opacity:1}}
.filet{width:72px;height:4px;background:var(--meleze)}
h1{font:400 56px/1.15 var(--serif);margin:0;max-width:1000px;color:var(--sapin)}
p{margin:0;font:400 26px/1.4 var(--sans);color:var(--encre)}
.v{font:400 20px/1.4 var(--sans);color:var(--second)}
</style></head><body><main>
<div class="filet"></div>
<h1>Richemont 3B · Le bon prix pour chaque date, et la preuve derrière.</h1>
<p>Tom Weisz · exercice Stonks Holding · novembre 2026</p>
<p class="v">Voix de synthèse</p>
</main></body></html>
